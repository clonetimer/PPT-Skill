<text x="237.0" y="413.325" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="22.5" fill="#65717C"><tspan x="237.0" dy="0">Subsystem- and</tspan><tspan x="237.0" dy="26.549999999999997">function-informed</tspan><tspan x="237.0" dy="26.549999999999997">parameter ordering</tspan></text>
