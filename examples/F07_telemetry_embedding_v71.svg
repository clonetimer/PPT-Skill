<text x="1233.0" y="626.0" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="21.666666666666668" fill="#65717C"><tspan x="1233.0" dy="0">Five consecutive grids are stacked</tspan><tspan x="1233.0" dy="25.566666666666666">along the temporal axis.</tspan></text>
