<text x="69.6" y="824.4916666666666" text-anchor="start" dominant-baseline="middle" font-family="Times New Roman" font-size="20.833333333333332" fill="#65717C"><tspan x="69.6" dy="0">The 40 × 40 grid is a convolution-friendly feature layout, not a physical satellite topology.</tspan></text>
