<line x1="215" y1="645" x2="215" y2="710" stroke="#6B7280" stroke-width="2" stroke-dasharray="9 7" /><line x1="215" y1="710" x2="1355" y2="710" stroke="#6B7280" stroke-width="2" stroke-dasharray="9 7" /><line x1="1355" y1="710" x2="1355" y2="645" stroke="#6B7280" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="785" y="690" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#7A7A7A"><tspan x="785" dy="0">安全 / 资源异常</tspan></text><text x="800" y="790" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei" font-size="20" font-weight="400" fill="#9AA0A6"><tspan x="800" dy="0">连续退化采用加权分配；完全掉线由专用 FDIR 与硬隔离重构主导。</tspan></text>
