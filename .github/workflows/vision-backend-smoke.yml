name: Optional PaddleOCR model smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paddleocr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mmgraph-agent-figure-fidelity-20261113
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base PDF and figure dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-pptx jsonschema Pillow numpy pypdf PyMuPDF reportlab
      - name: Install optional PaddleOCR and ONNX Runtime
        run: python -m pip install -r requirements-vision.txt
      - name: Download models and run real inference smoke
        run: python tools/smoke_paddleocr_backend.py --output dist/vision_backend_smoke.json
      - name: Upload real-inference evidence
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-paddleocr-real-inference-smoke
          path: dist/vision_backend_smoke.json
          if-no-files-found: error
