name: Validate vector assets

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PowerPoint audit dependency
        run: python -m pip install --disable-pip-version-check python-pptx
      - name: Build FigureSpec examples
        run: python tools/build_v71_examples.py
      - name: Validate SVG examples
        run: python tools/validate_svg_examples.py
      - name: Validate JSON profiles, specs, and manifest
        run: |
          python -m json.tool profiles/STYLE_PROFILES_V7.json > /dev/null
          python -m json.tool profiles/VECTOR_COMPONENT_CATALOG_V7.json > /dev/null
          python -m json.tool figure_specs/B01_engineering_fdir.json > /dev/null
          python -m json.tool figure_specs/F07_telemetry_embedding.json > /dev/null
          python -m json.tool MANIFEST_V7.json > /dev/null
      - name: Validate FigureSpec dual rendering
        run: python tools/validate_figure_specs.py
      - name: Audit generated PowerPoint examples
        run: |
          python tools/audit_pptx.py dist/B01_engineering_fdir_v71.pptx --strict
          python tools/audit_pptx.py dist/F07_telemetry_embedding_v71.pptx --strict
      - name: Compile tooling
        run: |
          python -m py_compile tools/audit_pptx.py
          python -m py_compile tools/render_figure_spec.py
          python -m py_compile tools/validate_figure_specs.py
          python -m py_compile tools/validate_svg_examples.py
          python -m py_compile tools/build_v71_examples.py
      - name: Upload generated vector examples
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-v7.1.1-figure-spec-examples
          path: |
            examples/B01_engineering_fdir_v71.svg
            examples/F07_telemetry_embedding_v71.svg
            dist/B01_engineering_fdir_v71.pptx
            dist/F07_telemetry_embedding_v71.pptx
          if-no-files-found: error
