name: Validate vector assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**", "feature/**"]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Historical FigureSpec and render parity uses the pre-V7.6 commit.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check python-pptx jsonschema Pillow numpy pypdf fonttools
      - name: Install experimental PDF figure recovery dependencies
        run: python -m pip install --disable-pip-version-check PyMuPDF reportlab
      - name: Install LibreOffice rendering tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          apt_network_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network_options[@]}" update
          sudo apt-get "${apt_network_options[@]}" install -y --no-install-recommends libreoffice-impress poppler-utils fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-cjk
      - name: Test editable PDF figure recovery and Office portability
        run: |
          python tools/test_audit_blind10_sources.py
          python tools/test_run_blind10_post_p0.py
          python tools/test_pdf_figure_import.py
          python tools/test_pdf_crop_assets.py
          python tools/test_pdf_import_budgets.py
          python tools/test_text_geometry_import.py
          python tools/test_text_geometry_audit.py
          python tools/test_final_delivery_success.py
          python tools/test_local_repair_loop.py
          python tools/test_repair_case_c01_seanet.py
          python tools/test_audit_pptx.py
          python tools/test_repair_case_c01_fbg_round1.py
          python tools/test_repair_case_c01_seanet_round2.py
          python tools/test_repair_case_c01_composite_round2.py
          python tools/test_c01_composite_explainer_v76.py
          python tools/test_prepare_15_figure_initial_cohort.py
          python tools/test_fifteen_figure_review_packet.py
          python tools/test_reproduction_release_gate.py
          python tools/test_reproduction_pipeline.py
          python tools/test_figure_spec_release_audit.py
          python tools/test_source_layout_extraction.py
          python tools/test_source_layout_vision.py
          python tools/test_source_layout_vision_backend.py
          python tools/test_source_layout_vision_integration.py
          python tools/test_source_crop_manifest.py
          python tools/test_source_layout_benchmark.py
          python tools/test_source_layout_review.py
          python tools/test_source_layout_visual_review.py
          python tools/test_source_reconstruction_router.py
          python tools/test_source_region_composer.py
          python tools/test_audit_source_composition_pptx.py
          python tools/test_reconstruction_quality_metrics.py
          python tools/test_source_layout_split_review.py
          python tools/test_source_layout_constraints.py
          python tools/test_apply_reviewed_geometry.py
          python tools/test_source_layout_benchmark.py
          python tools/test_audit_imported_pdf_figure.py
          python tools/test_office2016_compat.py
          python tools/test_figure_first_pass_gate.py
          python tools/test_audit_source_grounded_radar.py
          python tools/test_unseen_figure_families.py
          python tools/test_image_first_workflow.py
          python tools/test_image_first_stage_a.py
          python tools/test_c01_image_first_source_figure_v8.py
          python tools/test_c01_image_first_v4.py
          python tools/test_c01_image_first_v4_1.py
          python tools/test_c01_image_first_v4_3.py
          python tools/test_figure_spec_pptx_provenance.py
          python tools/test_figure_ast_writers.py
          python tools/test_text_layout_metrics.py
          python tools/test_render_with_libreoffice.py
          python tools/test_compare_rendered_images.py
          python tools/test_validate_ast_parity.py
      - name: Validate committed Image-first example before generated specs are rebuilt
        run: |
          python tools/validate_deck_spec_v76.py specs/deck_spec_v8.example.json
          python tools/validate_deck_spec_v76.py specs/deck_spec_v8_v4_1.example.json
          python tools/validate_image_first_workflow.py specs/image_first_workflow_v8.example.json --diagnostics dist/validation_diagnostics/image_first_workflow_failure.json
      - name: Upload committed Image-first validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-first-content-lock-validation-diagnostics
          path: dist/validation_diagnostics/**
          if-no-files-found: warn
      - name: Build B01/F07
        run: |
          python tools/build_v71_examples.py
          python tools/validate_b01_engineering_fdir.py
          python tools/validate_f07_telemetry_embedding.py
      - name: Render independent-paper generalization trials
        run: |
          python tools/render_figure_spec.py dist/skill_tests/generalization/Mamba_Figure1.json --svg dist/skill_tests/generalization/Mamba_Figure1.svg --pptx dist/skill_tests/generalization/Mamba_Figure1.pptx
          python tools/render_figure_spec.py dist/skill_tests/generalization/Swin_Figure2.json --svg dist/skill_tests/generalization/Swin_Figure2.svg --pptx dist/skill_tests/generalization/Swin_Figure2.pptx
          python tools/test_generalization_specs.py
          python tools/audit_pptx.py dist/skill_tests/generalization/Mamba_Figure1.pptx --strict
          python tools/audit_pptx.py dist/skill_tests/generalization/Swin_Figure2.pptx --strict
      - name: Build C01
        run: |
          python tools/build_c01_v73.py
          python tools/build_c01_fbg_v74.py
          python tools/validate_c01_fbg_v74.py
          python tools/build_c01_v74.py
          python tools/build_c01_seanet_v74.py
          python tools/build_c01_composite_v75.py
          python tools/build_c01_image_first_source_figure_v8.py
      - name: Build C01 AST dual-writer and LibreOffice parity pilot
        run: |
          mkdir -p dist/ast_pilot
          python tools/render_figure_spec.py figure_specs/c01/C01_composite_defense_slide_image_first_v4_1.json --svg dist/ast_pilot/legacy.svg --pptx dist/ast_pilot/legacy.pptx
          python tools/render_figure_ast.py figure_specs/c01/C01_composite_defense_slide_image_first_v4_1.json --svg dist/ast_pilot/ast.svg --pptx dist/ast_pilot/ast.pptx --ast-json dist/ast_pilot/figure_ast.json --preserve-source-ids
          python tools/render_with_libreoffice.py dist/ast_pilot/legacy.pptx --output-dir dist/ast_pilot/legacy_render --profile profiles/renderer/lo_headless_v1.json
          python tools/render_with_libreoffice.py dist/ast_pilot/ast.pptx --output-dir dist/ast_pilot/ast_render --profile profiles/renderer/lo_headless_v1.json
          python tools/validate_ast_parity.py --legacy-pptx dist/ast_pilot/legacy.pptx --ast-pptx dist/ast_pilot/ast.pptx --legacy-png dist/ast_pilot/legacy_render/legacy-slide-1.png --ast-png dist/ast_pilot/ast_render/ast-slide-1.png --diff dist/ast_pilot/legacy_vs_ast_diff.png --output dist/ast_pilot/legacy_vs_ast_metrics.json
          python tools/audit_figure_spec_text_fit.py figure_specs/c01/C01_composite_defense_slide_image_first_v4_1.json --output dist/ast_pilot/text_fit_preflight.json
          python tools/calibrate_text_fit_against_pdf.py dist/ast_pilot/ast.pptx --pdf dist/ast_pilot/ast_render/ast.pdf --output dist/ast_pilot/text_fit_calibration.json --strict
      - name: Validate FigureAST contracts and source-backed literature corpus
        run: |
          python tools/test_figure_ast_writers.py
          python tools/test_figure_ast_generalization.py
          python tools/test_validate_ast_parity.py
          python tools/test_text_layout_metrics.py
          python tools/test_calibrate_text_fit_against_pdf.py
      - name: Run non-blocking real-paper FigureAST dual-writer experiment
        id: ast_generalization
        continue-on-error: true
        run: |
          python tools/run_ast_generalization_pilot.py --manifest specs/ast_generalization_corpus_v1.json --output-dir dist/ast_generalization --profile profiles/renderer/lo_headless_v1.json
      - name: Preserve independent-paper AST diagnostics on experiment failure
        if: always() && steps.ast_generalization.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-ast-literature-corpus-failure-diagnostics
          path: dist/ast_generalization/**
          if-no-files-found: warn
      - name: Execute C01-FBG source-grounded repair
        run: |
          python tools/repair_case_c01_fbg_round1.py --output-dir dist/repair_cases/C01_FBG --accepted-output dist/accepted_repairs/C01_FBG_construction_v74.pptx
      - name: Execute C01-SEANet multi-round source-grounded repair
        run: |
          python tools/repair_case_c01_seanet_round2.py --output-dir dist/repair_cases/C01_SEANet --accepted-output dist/accepted_repairs/C01_SEANet_graph_level_v74.pptx
      - name: Generate and validate C01 Image-first Stage A prompt
        run: |
          python tools/create_image_first_manifest.py specs/deck_spec_v8.example.json s02 --output-dir dist/image_first/fbg-seanet-s02
          python tools/validate_image_first_workflow.py dist/image_first/fbg-seanet-s02/workflow.json
          python tools/create_image_first_manifest.py specs/deck_spec_v8_v4.example.json s02 --output-dir dist/image_first/fbg-seanet-s02-v4
          python tools/validate_image_first_workflow.py dist/image_first/fbg-seanet-s02-v4/workflow.json
          mkdir -p dist/image_first/fbg-seanet-s02-v4/source
          cp figure_specs/c01/C01_composite_defense_slide_image_first_v4.json dist/image_first/fbg-seanet-s02-v4/source/
          cp specs/c01_composite_expected_topology_v4.json dist/image_first/fbg-seanet-s02-v4/source/
          cp specs/deck_spec_v8_v4.example.json dist/image_first/fbg-seanet-s02-v4/source/
          cp docs/C01_STAGE_A_MAJOR_REVISION_V4.md dist/image_first/fbg-seanet-s02-v4/source/
          python tools/create_image_first_manifest.py specs/deck_spec_v8_v4_1.example.json s02 --output-dir dist/image_first/fbg-seanet-s02-v4-1
          python tools/validate_image_first_workflow.py dist/image_first/fbg-seanet-s02-v4-1/workflow.json
          mkdir -p dist/image_first/fbg-seanet-s02-v4-1/source
          cp figure_specs/c01/C01_composite_defense_slide_image_first_v4_1.json dist/image_first/fbg-seanet-s02-v4-1/source/
          cp specs/c01_composite_expected_topology_v4_1.json dist/image_first/fbg-seanet-s02-v4-1/source/
          cp specs/deck_spec_v8_v4_1.example.json dist/image_first/fbg-seanet-s02-v4-1/source/
          cp docs/C01_STAGE_A_MINOR_REVISION_V4_1.md dist/image_first/fbg-seanet-s02-v4-1/source/
          cp docs/C01_IMAGE2_STAGE_A_CANDIDATE_V4_1.md dist/image_first/fbg-seanet-s02-v4-1/source/
          python tools/create_image_first_manifest.py specs/deck_spec_v8_v4_1.example.json s02 --output-dir dist/image_first/fbg-seanet-s02-v4-3
          python tools/validate_image_first_workflow.py dist/image_first/fbg-seanet-s02-v4-3/workflow.json
          mkdir -p dist/image_first/fbg-seanet-s02-v4-3/source
          cp figure_specs/c01/C01_composite_defense_slide_image_first_v4_1.json dist/image_first/fbg-seanet-s02-v4-3/source/
          cp specs/c01_composite_expected_topology_v4_1.json dist/image_first/fbg-seanet-s02-v4-3/source/
          cp specs/deck_spec_v8_v4_1.example.json dist/image_first/fbg-seanet-s02-v4-3/source/
          cp docs/C01_V73_SOURCE.md dist/image_first/fbg-seanet-s02-v4-3/source/
          cp docs/C01_IMAGE_FIRST_STAGE_A_CANDIDATE_V4_3.md dist/image_first/fbg-seanet-s02-v4-3/source/
          cp docs/C01_STAGE_A_REVIEW_FORM_V4_3.md dist/image_first/fbg-seanet-s02-v4-3/source/
          cp docs/C01_STAGE_A_PROJECTION_TEST_V4_3.md dist/image_first/fbg-seanet-s02-v4-3/source/
          mkdir -p dist/image_first/fbg-seanet-s02/source
          cp figure_specs/c01/C01_composite_defense_slide_image_first_v8.json dist/image_first/fbg-seanet-s02/source/
          cp specs/c01_composite_expected_topology_v8.json dist/image_first/fbg-seanet-s02/source/
          cp docs/C01_V73_SOURCE.md dist/image_first/fbg-seanet-s02/source/
          cp docs/C01_IMAGE2_TOPOLOGY_AUDIT_V8.md dist/image_first/fbg-seanet-s02/source/
          cp docs/C01_STAGE_A_TECHNICAL_REVIEW_2026-11-16.md dist/image_first/fbg-seanet-s02/source/
          cp docs/C01_STAGE_A_REMEDIATION_2026-11-16.md dist/image_first/fbg-seanet-s02/source/
          cp docs/C01_STAGE_A_REVIEW_PACKAGE_README_V3.md dist/image_first/fbg-seanet-s02/source/
          cp specs/deck_spec_v8.example.json dist/image_first/fbg-seanet-s02/source/
          cp docs/C01_IMAGE2_STAGE_A_CANDIDATE_V3.md dist/image_first/fbg-seanet-s02/source/
          cp docs/C01_STAGE_B_RECONSTRUCTION_PLAN_V8.md dist/image_first/fbg-seanet-s02/source/
      - name: Execute C01 composite multi-round source-grounded repair
        run: |
          python tools/repair_case_c01_composite_round2.py --output-dir dist/repair_cases/C01_composite --accepted-output dist/accepted_repairs/C01_composite_defense_slide_v75.pptx
      - name: Build enlarged two-slide C01 explainer companion
        run: |
          python tools/build_c01_composite_explainer_v76.py
          python tools/validate_c01_composite_explainer_v76.py
          python tools/audit_pptx.py dist/C01_composite_explainer_v76.pptx --strict
      - name: Build data and image examples
        run: |
          python tools/build_quantitative_examples.py
          python tools/build_wine_scatter.py
          python tools/build_publication_example.py
          python tools/build_image_quant_example.py
          python tools/repair_case_deck01_round1.py --output-dir dist/repair_cases/DECK01 --accepted-output dist/accepted_repairs/DECK01_c01_defense_v76.pptx
      - name: Validate SVG and JSON
        run: |
          python tools/validate_svg_examples.py
          python -m json.tool profiles/C01_SOURCE_PROFILE_V73.json > /dev/null
          python -m json.tool figure_specs/c01/C01_FBG_construction.json > /dev/null
          python -m json.tool figure_specs/c01/C01_FBG_construction_v74.json > /dev/null
          python -m json.tool figure_specs/c01/C01_SEANet_graph_level.json > /dev/null
          python -m json.tool figure_specs/c01/C01_SEANet_graph_level_v74.json > /dev/null
          python -m json.tool figure_specs/c01/C01_composite_defense_slide_v75.json > /dev/null
          python -m json.tool specs/c01_composite_expected_topology_v75.json > /dev/null
          python -m json.tool specs/c01_composite_expected_topology_v8.json > /dev/null
          python -m json.tool figure_specs/c01/C01_composite_defense_slide_image_first_v8.json > /dev/null
          python -m json.tool MANIFEST_V7.json > /dev/null
          python -m json.tool specs/deck_spec_v75.example.json > /dev/null
          python -m json.tool specs/deck_spec_v75.schema.json > /dev/null
          python -m json.tool specs/deck_spec_v76.example.json > /dev/null
          python -m json.tool specs/deck_spec_v8.example.json > /dev/null
          python -m json.tool specs/deck_spec_v8_v4.example.json > /dev/null
          python -m json.tool specs/deck_spec_v8_v4_1.example.json > /dev/null
          python -m json.tool figure_specs/c01/C01_composite_defense_slide_image_first_v4_1.json > /dev/null
          python -m json.tool specs/c01_composite_expected_topology_v4_1.json > /dev/null
          python -m json.tool specs/deck_spec_v76.schema.json > /dev/null
          python -m json.tool specs/15_figure_diagnostic_ledger_v76.json > /dev/null
          python -m json.tool specs/image_first_workflow_v8.schema.json > /dev/null
          python -m json.tool specs/image_first_workflow_v8.example.json > /dev/null
          python -m json.tool figure_specs/c01/C01_composite_defense_slide.json > /dev/null
      - name: Validate FigureSpecs
        run: |
          python tools/validate_figure_specs.py
          python tools/validate_c01_v73.py
          python tools/validate_c01_v74.py
          python tools/validate_c01_seanet_v74.py
          python tools/validate_c01_composite_v75.py
          python tools/validate_deck_spec.py
          python tools/validate_deck_spec_v76.py
          python tools/validate_deck_spec_v76.py specs/deck_spec_v8.example.json
          python tools/validate_scientific_ir.py
          python tools/validate_quantitative_examples.py
          python tools/export_quantitative_reproduction_audit.py
          python tools/test_export_quantitative_reproduction_audit.py
          python tools/validate_wine_scatter.py
          python tools/test_wine_contract.py
          python tools/validate_publication_example.py
          python tools/validate_image_quant_example.py
          python tools/test_scientific_ir.py
          python tools/test_quantitative_contract.py
          python tools/test_chart_contract.py
          python tools/test_scientific_value_mutations.py
          python tools/validate_research_benchmark.py
          python tools/test_release_readiness.py
          python tools/test_repair_case_artifacts.py
          python tools/test_repair_case_deck01_round1.py
          python tools/test_prepare_no_repair_candidates.py
          python tools/test_package_15_final_candidates.py
          python tools/validate_output_profiles.py
          python tools/test_output_profiles.py
          python tools/check_scientific_accessibility.py
          python tools/validate_render_record.py
          python tools/test_render_record_canonical.py
          python tools/validate_render_semantics.py
          python tools/validate_legacy_label_parity.py
          python tools/validate_deck_benchmark.py
      - name: Audit generated PPTX
        run: |
          python tools/audit_pptx.py dist/C01_FBG_construction_v73.pptx --strict
          python tools/audit_pptx.py dist/C01_FBG_construction_v74.pptx --strict
          python tools/audit_pptx.py dist/C01_SEANet_graph_level_v73.pptx --strict
          python tools/audit_pptx.py dist/C01_SEANet_graph_level_v74.pptx --strict
          python tools/audit_pptx.py dist/C01_composite_defense_slide_v75.pptx --strict
          python tools/audit_pptx.py dist/C01_composite_explainer_v76.pptx --strict
          python tools/audit_pptx.py dist/C01_composite_defense_slide_v74.pptx --strict
          python tools/audit_pptx.py dist/Q01_iris_scatter.pptx --strict
          python tools/audit_pptx.py dist/Q02_iris_strip.pptx --strict
          python tools/audit_pptx.py dist/Q03_iris_mean_ci.pptx --strict
          python tools/audit_pptx.py dist/Q03_iris_mean_ci_nature.pptx --strict
          python tools/audit_pptx.py dist/Q04_iris_confusion.pptx --strict
          python tools/audit_pptx.py dist/Q05_iris_ablation.pptx --strict
          python tools/audit_pptx.py dist/Q06_iris_trend_interval.pptx --strict
          python tools/audit_pptx.py dist/Q07_wine_scatter.pptx --strict
          python tools/audit_pptx.py dist/Q08_wine_strip.pptx --strict
          python tools/audit_pptx.py dist/I01_cell_image_quant.pptx --strict --allow-raster
          python tools/audit_pptx.py dist/DECK01_c01_defense_v76.pptx --strict
      - name: Compile tools
        run: python -m py_compile tools/*.py
      - name: Prepare immutable 15-figure initial cohort
        run: |
          python tools/prepare_15_figure_initial_cohort.py dist --c01-seanet-initial dist/repair_cases/C01_SEANet/rounds/first_pass.pptx --deck01-initial dist/repair_cases/DECK01/rounds/first_pass.pptx --output-dir dist/initial_pass
      - name: Preserve diagnosed no-repair candidates
        run: python tools/prepare_no_repair_candidates.py dist/initial_pass dist/accepted_repairs
      - name: Package complete 15-task final candidates
        run: python tools/package_15_final_candidates.py --output dist/PPT-Skill_15_final_candidates_v76.zip
      - name: Prepare separate review stages
        run: |
          python tools/prepare_scientific_review_bundle.py --stage initial --output dist/scientific_review_initial_v76.zip
          python tools/prepare_scientific_review_bundle.py --stage reconciliation --output dist/scientific_review_reconciliation_v76.zip
      - name: Prepare 15-figure initial versus repair review
        run: |
          python tools/fifteen_figure_review_packet.py dist/initial_pass dist/accepted_repairs --output-dir dist/15_figure_repair_review
      - name: Validate complete generated manifest
        run: python tools/validate_manifest.py
      - name: Upload complete 15-task final candidate package
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-v7.6-final-candidate-package
          path: dist/PPT-Skill_15_final_candidates_v76.zip
          if-no-files-found: error
      - name: Upload 15-figure repair-review ledger
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-15-figure-repair-review
          path: |
            dist/15_figure_repair_review/*
          if-no-files-found: error
      - name: Upload C01-SEANet multi-round repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-c01-seanet-round2
          path: |
            dist/repair_cases/C01_SEANet/*
            dist/accepted_repairs/C01_SEANet_graph_level_v74.pptx
          if-no-files-found: error
      - name: Upload C01-FBG repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-c01-fbg-round1
          path: |
            dist/repair_cases/C01_FBG/*
            dist/accepted_repairs/C01_FBG_construction_v74.pptx
            dist/C01_FBG_construction_v74.pdf
            dist/C01_FBG_construction_v74.preview.png
          if-no-files-found: error
      - name: Upload C01 composite multi-round repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-c01-composite-round2
          path: |
            dist/repair_cases/C01_composite/*
            dist/accepted_repairs/C01_composite_defense_slide_v75.pptx
          if-no-files-found: error
      - name: Upload C01 two-slide explainer companion
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-c01-composite-explainer-v76
          path: |
            dist/C01_composite_explainer_v76.pptx
            dist/C01_composite_explainer_v76.pdf
            dist/C01_composite_explainer_v76_slide_1.png
            dist/C01_composite_explainer_v76_slide_2.png
            dist/accepted_repairs/C01_composite_explainer_v76.*
          if-no-files-found: error
      - name: Upload DECK01 multi-round repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: ppt-skill-deck01-round1
